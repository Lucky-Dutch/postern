[package]
name = "postern"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A focused PostgreSQL desktop client written in Rust"
license = "MIT"

[features]
smoke = ["dep:png"]

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "persistence", "system_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["serde", "syntect"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "6"
keyring = { version = "3", features = ["apple-native"] }
rfd = "0.15"
sqlformat = "0.3"
png = { version = "0.18", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
all = "warn"
