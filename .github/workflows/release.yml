name: Release
# Pushing a version tag, such as v0.1.0, builds the disk image and publishes it
# as a GitHub release, so Postern can be installed without cloning.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: sh scripts/make-dmg.sh
      - run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Postern $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
